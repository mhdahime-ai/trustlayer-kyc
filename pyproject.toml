[project]
name = "trustlayer-kyc"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI uses File()/Form() in defaults by design

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
